# Training / inference environment for AxialFlowNet code release
# create:  conda env create -f environment.yml
# activate: conda activate axialflownet
name: axialflownet
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pip=24.0
  - pytorch=2.4.1
  - torchvision=0.19.1
  - pytorch-cuda=11.8
  - numpy=1.24.4
  - pillow=11.3.0
  - scikit-image=0.24.0
  - tifffile=2024.8.30
  - dominate>=2.6.0
  - beautifulsoup4>=4.11.0
  - requests>=2.28.0
